<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Serialization in ML Engineering</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for rendering equations -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false // We will trigger typesetting manually in JS
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        /* Smooth transitions for the step content */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }

        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div
        class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col h-[700px]">

        <!-- Header / Progress Area -->
        <div class="bg-blue-600 p-6 text-white">
            <h1 class="text-2xl font-bold tracking-tight">Machine Learning Model Serialization</h1>
            <p class="text-blue-100 text-sm mt-1">Understanding how models move from Research to Production</p>

            <!-- Progress Bar -->
            <div class="mt-6 flex items-center justify-between relative">
                <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-blue-400 rounded-full z-0">
                </div>
                <div id="progress-fill"
                    class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-white rounded-full z-0 transition-all duration-300 w-0">
                </div>

                <!-- Step Indicators (Generated by JS) -->
                <div id="progress-dots" class="flex justify-between w-full z-10 relative">
                    <!-- Dots injected here -->
                </div>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div class="flex-grow overflow-y-auto flex flex-col items-center p-8 relative">
            <div id="step-content" class="w-full max-w-2xl text-center fade-enter my-auto py-4">
                <!-- Visual Icon Area -->
                <div id="step-icon" class="h-40 w-full flex items-center justify-center mb-6">
                    <!-- SVG injected here -->
                </div>

                <!-- Text Area -->
                <h2 id="step-title" class="text-3xl font-bold text-slate-800 mb-4">Title</h2>
                <div id="step-desc" class="text-lg text-slate-600 leading-relaxed text-justify">
                    Description goes here.
                </div>
            </div>
        </div>

        <!-- Navigation Footer -->
        <div class="p-6 border-t border-slate-100 flex justify-between bg-slate-50 items-center">
            <button id="btn-back" onclick="prevStep()"
                class="px-6 py-2.5 rounded-lg font-medium text-slate-600 bg-white border border-slate-300 hover:bg-slate-100 hover:text-slate-800 transition disabled:opacity-50 disabled:cursor-not-allowed">
                &larr; Previous Step
            </button>
            <div id="step-counter" class="text-sm font-semibold text-slate-500">
                Step 1 of 6
            </div>
            <button id="btn-next" onclick="nextStep()"
                class="px-6 py-2.5 rounded-lg font-medium text-white bg-blue-600 hover:bg-blue-700 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                Next Step &rarr;
            </button>
        </div>
    </div>

    <script src="../js/model_serialization.js"></script>
</body>

</html>
