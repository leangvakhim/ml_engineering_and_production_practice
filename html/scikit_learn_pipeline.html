<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scikit-Learn Pipeline Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX for Math Equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        /* Custom animations */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <!-- Main App Container -->
    <div
        class="bg-white rounded-2xl shadow-xl w-full max-w-5xl overflow-hidden border border-slate-200 flex flex-col h-[750px] sm:h-[650px]">

        <!-- Header -->
        <header
            class="bg-white border-b border-slate-100 px-6 sm:px-8 py-4 sm:py-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 sm:gap-0 z-10 shrink-0">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <svg class="w-6 h-6 sm:w-7 sm:h-7 text-indigo-600 shrink-0" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10">
                        </path>
                    </svg>
                    Scikit-Learn Pipeline Visualizer
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">ML Engineering & Production Best Practices</p>
            </div>

            <!-- Progress Indicator -->
            <div class="flex items-center space-x-2 shrink-0" id="progress-dots">
                <!-- Dots injected via JS -->
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-grow p-8 overflow-y-auto relative bg-white" id="content-area">
            <!-- Content injected via JS -->
        </main>

        <!-- Footer / Navigation -->
        <footer class="bg-slate-50 border-t border-slate-200 px-4 sm:px-8 py-4 shrink-0">
            <div class="flex justify-between items-center w-full">
                <button id="btn-back"
                    class="px-3 sm:px-5 py-2 sm:py-2.5 rounded-lg text-sm sm:text-base font-medium text-slate-600 bg-white border border-slate-300 hover:bg-slate-100 hover:text-slate-900 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1 sm:gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7">
                        </path>
                    </svg>
                    <span class="hidden sm:inline">Back Step</span>
                    <span class="sm:hidden">Back</span>
                </button>

                <div id="step-counter" class="text-xs sm:text-sm font-semibold text-slate-500 text-center mx-2">
                    Step 1 of 6
                </div>

                <button id="btn-next"
                    class="px-3 sm:px-5 py-2 sm:py-2.5 rounded-lg text-sm sm:text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1 sm:gap-2">
                    <span class="hidden sm:inline">Next Step</span>
                    <span class="sm:hidden">Next</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="../js/scikit_learn_pipeline.js"></script>
</body>

</html>
